[project]
name = "interactive-novel-system"
version = "0.2.0"
description = "交互式多Agent协作小说创作系统"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite>=1.0",
    "langgraph-checkpoint-postgres>=1.0",
    "openai>=1.0",
    "python-dotenv>=1.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "pydantic>=2.0",
    "sse-starlette>=1.0",
    "asyncpg>=0.28.0",
    "mcp>=1.0",
    "langchain-chroma>=0.1.0",
    "langchain-text-splitters>=0.1.0",
    "langchain-community>=0.2.0",
    "langchain-openai>=0.1.0",
    "langchain-core>=0.2.0",
    "pymupdf>=1.24.0",
    "docx2txt>=0.8",
    "python-multipart>=0.0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
